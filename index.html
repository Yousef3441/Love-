
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Heart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060208;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    display: block;
    width: min(100vw, 100vh);
    height: min(100vw, 100vh);
}
</style>
</head>

<body>

<canvas id="canvas" width="800" height="800"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const SC = 21;
const OY = 20;
const DURATION = 10;
const TICK = 16;
const ANIM = 42;
const LIFT = 34;
const GAP = 7;
const SIZES = [9, 10, 11, 12];
const FONT = "Tahoma, Arial";
const BG = "#060208";

const PHRASES = [
    "I love you",
    "Seni seviyorum",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Ti amo",
    "Eu te amo",
    "Я тебя люблю",
    "사랑해",
    "愛してる",
    "我爱你",
    "मैं तुमसे प्यार करता हूँ",
    "Σ' αγαπώ",
    "Ik hou van jou",
    "Jag älskar dig",
    "Kocham cię",
    "ฉันรักเธอ",
    "Anh yêu em",
    "Aku cinta kamu",
    "Я тебе кохаю",
    "دوستت دارم",
    "عاشقتم",
    "خیلی دوستت دارم",
    "جان دلم",
    "همیشه دوستت دارم",
    "عشق من",
    "قلب من",
    "تو دنیای منی",
    "با تمام وجودم دوستت دارم"
];

const rng = (() => {
    let seed = 11;

    return {
        random() {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
        },

        uniform(a, b) {
            return a + this.random() * (b - a);
        },

        choice(arr) {
            return arr[Math.floor(this.random() * arr.length)];
        },

        shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(this.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    };
})();

const CENTER = 400;

function font(size) {
    return `bold ${size}px ${FONT}`;
}

function heart(a) {
    const x = 16 * Math.pow(Math.sin(a), 3);

    const y =
        13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a);

    return [
        x * SC,
        y * SC + OY
    ];
}

function hx(c) {
    return "#" + c.map(v =>
        Math.round(Math.max(0, Math.min(1, v)) * 255)
            .toString(16).padStart(2, "0")
    ).join("");
}

function mix(a, b, k) {
    return a.map((v, i) => v + (b[i] - v) * k);
}

function dim(c, k) {
    return c.map(v => v * k);
}

function clamp(v) {
    return Math.max(0, Math.min(1, v));
}

function mathDist(x, y) {
    return Math.hypot(
        x / (16 * SC),
        (y - CY) / (14.5 * SC)
    );
}

const POLY = [];

for (let i = 0; i < 720; i++) {
    POLY.push(heart(2 * Math.PI * i / 720));
}

const EDGES = POLY.map((p, i) => [
    p,
    POLY[(i + 1) % POLY.length]
]);

const YMAX = Math.max(...POLY.map(p => p[1]));
const YMIN = Math.min(...POLY.map(p => p[1]));
const CY = (YMAX + YMIN) / 2;

function spans(y) {
    const xs = [];

    for (const [[x1, y1], [x2, y2]] of EDGES) {

        if (
            (y1 <= y && y < y2) ||
            (y2 <= y && y < y1)
        ) {
            xs.push(
                x1 + (y - y1) * (x2 - x1) / (y2 - y1)
            );
        }
    }

    xs.sort((a, b) => a - b);

    const result = [];

    for (let i = 0; i < xs.length - 1; i += 2) {
        result.push([xs[i], xs[i + 1]]);
    }

    return result;
}

function intersect(A, B) {
    const out = [];

    for (const a of A) {
        for (const b of B) {
            const lo = Math.max(a[0], b[0]);
            const hi = Math.min(a[1], b[1]);

            if (hi - lo > 14) {
                out.push([lo, hi]);
            }
        }
    }

    return out;
}

function* phraseCycle() {
    while (true) {
        const order = rng.shuffle([...PHRASES]);
        yield* order;
    }
}

function measure(text, size) {
    ctx.font = font(size);
    return ctx.measureText(text).width;
}

function build() {
    const cycle = phraseCycle();

    const rowH = Math.max(...SIZES.map(size => size * 1.25)) + 4;
    const half = rowH / 2;

    const placed = [];

    let y = YMAX - half;

    while (y > YMIN + half) {

        const row = intersect(
            spans(y + half),
            spans(y - half)
        );

        for (const [start, end] of row) {

            const lo = start + 4;
            const hi = end - 4;

            let cur = lo + rng.uniform(0, 8);
            const line = [];

            while (true) {

                let fit = null;

                for (let attempt = 0; attempt < 10; attempt++) {

                    const text = cycle.next().value;
                    const size = rng.choice(SIZES);
                    const w = measure(text, size);

                    if (cur + w <= hi) {
                        fit = { text, size, w };
                        break;
                    }
                }

                if (!fit) break;

                const { text, size, w } = fit;

                line.push({
                    x: cur + w / 2,
                    text,
                    size,
                    w
                });

                cur += w + GAP;
            }

            if (!line.length) continue;

            if (line.length > 1) {

                const left =
                    hi - (line[line.length - 1].x +
                    line[line.length - 1].w / 2);

                for (let i = 0; i < line.length; i++) {
                    line[i].x += left * i / (line.length - 1);
                }

            } else {
                line[0].x = (lo + hi) / 2;
            }

            for (let i = 0; i < line.length; i++) {

                const p = line[i];

                placed.push({
                    x: p.x,
                    y,
                    text: p.text,
                    size: p.size,
                    edge: i === 0 || i === line.length - 1
                });
            }
        }

        y -= rowH;
    }

    const wine = [0.58, 0, 0.09];
    const crimson = [0.90, 0.05, 0.14];
    const blood = [0.98, 0.10, 0.16];

    for (const p of placed) {

        const rad = Math.min(1, mathDist(p.x, p.y));

        let base = mix(
            wine,
            crimson,
            0.25 + 0.75 * rad
        );

        base = mix(
            base,
            blood,
            rng.uniform(0, 0.35) + (p.edge ? 0.3 : 0)
        );

        p.color = base.map(v => Math.min(1, v));
        p.rad = rad;
    }

    const edges = placed.filter(p => p.edge);
    const inner = placed.filter(p => !p.edge);

    edges.sort((a, b) =>
        (Math.atan2(a.x, a.y - CY) + 2 * Math.PI) %
        (2 * Math.PI) -
        (Math.atan2(b.x, b.y - CY) + 2 * Math.PI) %
        (2 * Math.PI)
    );

    inner.sort((a, b) =>
        -a.rad + rng.uniform(0, 0.08) -
        (-b.rad + rng.uniform(0, 0.08))
    );

    return [...edges, ...inner];
}

const FLASH = [1.0, 0.78, 0.78];

const BGC = [
    parseInt(BG.slice(1, 3), 16) / 255,
    parseInt(BG.slice(3, 5), 16) / 255,
    parseInt(BG.slice(5, 7), 16) / 255
];

const ORDER = build();

let active = [];
let mainItems = [];
let tickNo = 0;

const RATE = ORDER.length / (DURATION * 1000 / TICK);

let acc = 0;
let index = 0;
let spawning = true;

function spawn(p) {

    p.f = 0;

    p.dx = rng.uniform(-10, 10);

    active.push(p);
    mainItems.push(p);
}

function animate(p) {

    p.f++;

    const u = clamp(p.f / ANIM);
    const e = 1 - Math.pow(1 - u, 3);

    const c = p.color;

    const x = CENTER + p.x;
    const y = CENTER - p.y;

    const hover = (1 - e) * LIFT;

    const px = x + p.dx * (1 - e);
    const py = y - hover;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Shadow
    ctx.font = font(p.size);
    ctx.fillStyle = hx(mix(BGC, dim(c, 0.30), e));

    ctx.fillText(
        p.text,
        px + 2,
        py + 3
    );

    // Glow
    ctx.font = font(p.size + 1);
    ctx.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));

    ctx.shadowColor = hx(c);
    ctx.shadowBlur = 8 * e;

    ctx.fillText(
        p.text,
        px,
        py
    );

    ctx.shadowBlur = 0;

    // Main text
    const flash = 0.75 * Math.sin(
        Math.PI * clamp((u - 0.55) / 0.45)
    );

    const col = mix(
        mix(BGC, c, Math.pow(e, 1.5)),
        FLASH,
        flash
    );

    ctx.font = font(p.size);
    ctx.fillStyle = hx(col);

    ctx.fillText(
        p.text,
        px,
        py
    );

    if (u >= 1) {
        p.finished = true;
        return false;
    }

    return true;
}

// Draw all completed texts permanently
function drawFinished() {

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const p of mainItems) {

        if (!p.finished) continue;

        const x = CENTER + p.x;
        const y = CENTER - p.y;

        ctx.font = font(p.size);

        let color = p.color;

        if (p.shimmer) {
            color = mix(color, FLASH, 0.6);
        }

        ctx.shadowColor = hx(color);
        ctx.shadowBlur = 8;

        ctx.fillStyle = hx(color);

        ctx.fillText(
            p.text,
            x,
            y
        );

        ctx.shadowBlur = 0;
    }
}

function shimmer() {

    if (!mainItems.length) return;

    const p = rng.choice(mainItems);

    p.shimmer = true;

    setTimeout(() => {
        p.shimmer = false;
    }, 260);
}

let lastTime = 0;
let accumulator = 0;
let shimmerTimer = 0;

function step(timestamp) {

    if (!lastTime) lastTime = timestamp;

    const delta = Math.min(timestamp - lastTime, 50);

    lastTime = timestamp;

    accumulator += delta;

    while (accumulator >= TICK) {

        accumulator -= TICK;
        tickNo++;

        if (spawning) {

            acc += RATE;

            while (acc >= 1 && index < ORDER.length) {
                acc--;
                spawn(ORDER[index++]);
            }

            if (index >= ORDER.length) {
                spawning = false;
            }
        }

        active = active.filter(p => !p.finished);
    }

    // Clear screen
    ctx.clearRect(0, 0, 800, 800);

    // Keep completed texts visible
    drawFinished();

    // Animate new texts
    for (const p of active) {
        if (!p.finished) {
            animate(p);
        }
    }

    // Final heart shimmer
    if (!spawning && active.length === 0) {

        shimmerTimer += delta;

        if (shimmerTimer >= 140) {
            shimmerTimer = 0;
            shimmer();
        }
    }

    requestAnimationFrame(step);
}

requestAnimationFrame(step);

</script>
</body>
</html>
